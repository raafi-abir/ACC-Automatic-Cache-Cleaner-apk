name: Release

# Push a tag like v1.0.0 and this builds a signed APK and publishes it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test cleaning script
        run: sh tests/clean_test.sh

      # Repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. The APK will be signed with a throwaway debug key and can't update an installed copy."
          fi

      - name: Build release APK
        run: >
          gradle :app:assembleRelease --no-daemon
          -PversionName="${GITHUB_REF_NAME#v}"
          -PversionCode="${{ github.run_number }}"
          -PupdateRepo="${{ github.repository }}"

      - name: Name the files
        run: |
          cp app/build/outputs/apk/release/*.apk "ACC-Shizuku-${GITHUB_REF_NAME}.apk"
          sha256sum "ACC-Shizuku-${GITHUB_REF_NAME}.apk" > "ACC-Shizuku-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "ACC-Shizuku-${GITHUB_REF_NAME}.apk"
          "ACC-Shizuku-${GITHUB_REF_NAME}.apk.sha256"
          --title "ACC Shizuku ${GITHUB_REF_NAME}"
          --generate-notes
